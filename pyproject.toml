[project]
name = "quran-analysis"
version = "0.2.0"
description = "Diyanet Kur'an API verisiyle Kur'an-ı Kerim üzerinde sayım ve istatistiksel analiz"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
quran-analysis = "quran_analysis.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quran_analysis*"]
